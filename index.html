<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Chat</title>

<style>

body{
margin:0;
font-family:system-ui;
background:linear-gradient(180deg,#020617,#020617,#020617,#020617,#0f172a);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.chat{

width:420px;
height:600px;
background:#020617;
border-radius:18px;
display:flex;
flex-direction:column;
box-shadow:
0 10px 40px rgba(0,0,0,0.6),
inset 0 0 0 1px #1e293b;

overflow:hidden;

}

.header{

padding:15px;
border-bottom:1px solid #1e293b;
font-weight:600;
letter-spacing:0.5px;

background:#020617;

}

.messages{

flex:1;
overflow-y:auto;
padding:20px;

display:flex;
flex-direction:column;

gap:12px;

}

.msg{

padding:12px 14px;
border-radius:14px;
max-width:80%;
font-size:14px;
line-height:1.4;

animation:fade 0.2s ease;

}

.user{

background:#2563eb;
color:white;
align-self:flex-end;

}

.ai{

background:#111827;
color:#e5e7eb;
align-self:flex-start;

}

.typing{

opacity:0.6;
font-style:italic;

}

.input-area{

display:flex;
padding:12px;
border-top:1px solid #1e293b;

background:#020617;

}

input{

flex:1;
padding:12px;
border-radius:10px;
border:none;
outline:none;

background:#020617;
color:white;

border:1px solid #1e293b;

}

button{

margin-left:8px;
padding:12px 16px;

border:none;
border-radius:10px;

background:#2563eb;
color:white;

cursor:pointer;

}

button:hover{

background:#1d4ed8;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(6px);
}

to{
opacity:1;
transform:none;
}

}

</style>

</head>

<body>

<div class="chat">

<div class="header">
Local AI
</div>

<div class="messages" id="messages">

<div class="msg ai">
Hello. Ask me anything.
</div>

</div>

<div class="input-area">

<input
id="input"
placeholder="Type message..."
autocomplete="off"
/>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

<script>

const API="https://miniplm-render.onrender.com"

const messages=document.getElementById("messages")
const input=document.getElementById("input")

function addMessage(text,type){

const div=document.createElement("div")

div.className="msg "+type

div.textContent=text

messages.appendChild(div)

messages.scrollTop=messages.scrollHeight

return div

}

async function sendMessage(){

const text=input.value.trim()

if(!text) return

input.value=""

addMessage(text,"user")

const typing=addMessage("thinking...","ai typing")

try{

const response=await fetch(API,{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:text
})

})

if(!response.ok){

throw new Error("server error")

}

const data=await response.json()

typing.remove()

addMessage(data.reply,"ai")

}

catch(error){

typing.textContent="Server sleeping... retry in 20 sec"

}

}

input.addEventListener("keypress",e=>{

if(e.key==="Enter") sendMessage()

})

</script>

</body>

</html>
