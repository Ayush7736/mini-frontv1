<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AI Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#020617;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{

width:420px;
max-width:95%;
height:600px;

background:#020617;

border-radius:14px;

display:flex;
flex-direction:column;

border:1px solid #1e293b;

box-shadow:0 0 40px rgba(0,0,0,0.6);

}

.top{

padding:14px;

border-bottom:1px solid #1e293b;

font-weight:bold;

color:white;

}

.chat{

flex:1;

overflow:auto;

padding:15px;

display:flex;
flex-direction:column;

gap:10px;

}

.msg{

padding:10px 14px;

border-radius:12px;

max-width:80%;

color:white;

font-size:14px;

}

.user{

background:#2563eb;

align-self:flex-end;

}

.ai{

background:#111827;

align-self:flex-start;

}

.bottom{

display:flex;

padding:10px;

border-top:1px solid #1e293b;

}

input{

flex:1;

padding:10px;

border-radius:10px;

border:1px solid #1e293b;

background:#020617;

color:white;

outline:none;

}

button{

margin-left:6px;

padding:10px 16px;

border:none;

border-radius:10px;

background:#2563eb;

color:white;

cursor:pointer;

}

button:hover{

background:#1d4ed8;

}

</style>

</head>

<body>

<div class="container">

<div class="top">
Local AI
</div>

<div id="chat" class="chat">

<div class="msg ai">
Ready.
</div>

</div>

<div class="bottom">

<input
id="input"
placeholder="message"
/>

<button onclick="send()">
Send
</button>

</div>

</div>

<script>

const url="https://miniplm-render.onrender.com/chat"

const chat=document.getElementById("chat")

function add(text,type){

const div=document.createElement("div")

div.className="msg "+type

div.innerText=text

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

async function send(){

const input=document.getElementById("input")

const text=input.value.trim()

if(!text) return

input.value=""

add(text,"user")

const thinking=add("thinking...","ai")

try{

const r=await fetch(url,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:text
})

})

const data=await r.json()

chat.lastChild.remove()

add(data.reply,"ai")

}

catch{

chat.lastChild.innerText="error or server sleeping"

}

}

document.getElementById("input")
.addEventListener("keypress",e=>{

if(e.key==="Enter") send()

})

</script>

</body>

</html>
