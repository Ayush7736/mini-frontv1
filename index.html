<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Local AI Chat</title>

<style>

body{

margin:0;
font-family:system-ui;

background:#020617;

height:100vh;

display:flex;
justify-content:center;
align-items:center;

}

.chat{

width:420px;
max-width:95%;

height:600px;

background:#020617;

border-radius:16px;

display:flex;
flex-direction:column;

box-shadow:0 10px 40px rgba(0,0,0,0.6);

overflow:hidden;

border:1px solid #1e293b;

}

.header{

padding:15px;

border-bottom:1px solid #1e293b;

display:flex;
justify-content:space-between;
align-items:center;

font-weight:600;

}

.status{

font-size:12px;
opacity:0.7;

}

.messages{

flex:1;

overflow-y:auto;

padding:20px;

display:flex;
flex-direction:column;

gap:10px;

}

.msg{

padding:12px 14px;

border-radius:14px;

max-width:80%;

font-size:14px;

line-height:1.4;

word-wrap:break-word;

}

.user{

background:#2563eb;
color:white;

align-self:flex-end;

}

.ai{

background:#111827;
color:#e5e7eb;

align-self:flex-start;

}

.loading{

opacity:0.6;
font-style:italic;

}

.inputArea{

display:flex;

padding:12px;

border-top:1px solid #1e293b;

}

input{

flex:1;

padding:12px;

border-radius:10px;

border:1px solid #1e293b;

background:#020617;

color:white;

outline:none;

}

button{

margin-left:8px;

padding:12px 16px;

border:none;

border-radius:10px;

background:#2563eb;

color:white;

cursor:pointer;

}

button:hover{

background:#1d4ed8;

}

.error{

color:#f87171;

font-size:12px;

padding:6px 12px;

}

</style>

</head>

<body>

<div class="chat">

<div class="header">

<span>Local AI</span>

<span id="status" class="status">connecting...</span>

</div>

<div id="messages" class="messages">

<div class="msg ai">
Hello. I am ready.
</div>

</div>

<div id="error" class="error"></div>

<div class="inputArea">

<input
id="input"
placeholder="Type message..."
autocomplete="off"
/>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

<script>

const API="https://miniplm-render.onrender.com/chat"

const messages=document.getElementById("messages")

const input=document.getElementById("input")

const status=document.getElementById("status")

const errorBox=document.getElementById("error")

function addMessage(text,type){

const div=document.createElement("div")

div.className="msg "+type

div.textContent=text

messages.appendChild(div)

messages.scrollTop=messages.scrollHeight

return div

}

async function testConnection(){

try{

await fetch(API,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:"ping"
})
})

status.textContent="online"

}

catch{

status.textContent="offline"

}

}

async function sendMessage(){

const text=input.value.trim()

if(!text) return

errorBox.textContent=""

input.value=""

addMessage(text,"user")

const loading=addMessage("thinking...","ai loading")

try{

const res=await fetch(API,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:text
})

})

if(!res.ok){

throw new Error("server error")

}

const data=await res.json()

loading.remove()

addMessage(data.reply,"ai")

}

catch(err){

loading.textContent="Server sleeping... wait 20 sec"

errorBox.textContent=err.message

status.textContent="offline"

}

}

input.addEventListener("keypress",e=>{

if(e.key==="Enter") sendMessage()

})

testConnection()

</script>

</body>

</html>
